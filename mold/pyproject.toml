[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mold-generator-engine"
version = "0.1.0"
description = "Core engine for generating 3D-printable molds."
requires-python = ">=3.13,<3.14"

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.15.19",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.ruff]
target-version = "py313"
line-length = 88
# The authoritative Python surface for this package is `src/` (the
# mold-generator-engine package itself, see [tool.setuptools.packages.find])
# and `tests/` (see [tool.pytest.ini_options] testpaths). `mold/` also holds
# the frontend/ TypeScript app and docs/cad-skills/'s own self-contained
# tooling test -- neither belongs to this package's quality gate.
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

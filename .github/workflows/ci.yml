name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality (mold/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mold

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest

  frontend-quality:
    name: Frontend quality (mold/frontend/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mold/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mold/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit for moderate-or-higher severity advisories
        run: npm audit --audit-level=moderate

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm run test:run

  browser-smoke:
    name: Browser smoke (mold/frontend/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mold/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mold/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Build E2E artifact (production toolchain + test-only harness entry)
        run: npm run build:e2e

      - name: Run browser smoke spec
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: mold/frontend/playwright-report/
          retention-days: 7

  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Check for whitespace / conflict-marker errors
        run: git diff --check

      - name: Reject stale dynamic repository-state claims in agent docs
        run: |
          if grep -RInE '^[-*]?\s*(Branch|HEAD):|uncommitted right now|current working tree' mold/docs/agent/ 2>/dev/null; then
            echo "::error::mold/docs/agent/ must not hard-code dynamic repository state (branch/HEAD/uncommitted claims) -- discover it live via git instead."
            exit 1
          fi

      - name: Verify tracked text files are valid UTF-8
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files -z -- '*.md' '*.py' '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.yml' '*.yaml' '*.toml' '*.css' '*.html' '*.txt' '*.cfg' '*.ini')
          status=0
          for file in "${files[@]}"; do
            if ! iconv -f UTF-8 -t UTF-8 "$file" > /dev/null 2>&1; then
              echo "::error file=$file::Tracked text file is not valid UTF-8."
              status=1
            fi
          done
          echo "Checked ${#files[@]} tracked text files for valid UTF-8."
          exit "$status"

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      - python-quality
      - frontend-quality
      - browser-smoke
      - repository-integrity
      - dependency-review
    if: always()
    steps:
      # Explicit allowed-result matrix instead of a broad
      # failure/cancelled-only check: that pattern lets an *unexpected*
      # skipped/action_required/timed_out result for any of these jobs slip
      # through as if it were success, since none of those literal strings
      # are "failure" or "cancelled". Each required job here must equal
      # "success" exactly, no exceptions.
      #
      # dependency-review only runs `if: github.event_name == 'pull_request'`
      # (see its own job below), so on an ordinary push its result is
      # legitimately "skipped" -- that must not fail this gate. On a pull
      # request it always runs, so "skipped" there would mean the job was
      # misconfigured/didn't trigger, not a legitimate absence; the gate must
      # fail in that case too, not treat it as automatically successful.
      - name: Require every quality job to match its allowed result
        env:
          PYTHON_QUALITY_RESULT: ${{ needs.python-quality.result }}
          FRONTEND_QUALITY_RESULT: ${{ needs.frontend-quality.result }}
          BROWSER_SMOKE_RESULT: ${{ needs.browser-smoke.result }}
          REPOSITORY_INTEGRITY_RESULT: ${{ needs.repository-integrity.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -u
          status=0

          require_success() {
            local job_name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::${job_name} must equal 'success' but was '${result}'."
              status=1
            fi
          }

          require_success "python-quality" "$PYTHON_QUALITY_RESULT"
          require_success "frontend-quality" "$FRONTEND_QUALITY_RESULT"
          require_success "browser-smoke" "$BROWSER_SMOKE_RESULT"
          require_success "repository-integrity" "$REPOSITORY_INTEGRITY_RESULT"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            require_success "dependency-review" "$DEPENDENCY_REVIEW_RESULT"
          elif [ "$DEPENDENCY_REVIEW_RESULT" != "skipped" ]; then
            echo "::error::dependency-review must equal 'skipped' on a non-pull_request event (${EVENT_NAME}) but was '${DEPENDENCY_REVIEW_RESULT}'."
            status=1
          fi

          exit "$status"

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Scan for newly-introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
